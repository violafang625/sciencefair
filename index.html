<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中華科研基地｜科學闖關挑戰</title><style>
:root{--ink:#18233b;--blue:#1266d8;--pink:#ff418c;--yellow:#ffdd4f;--mint:#15bba2;--paper:#fffdf9;--shadow:0 9px 0 #1b2640,0 18px 40px #152b5250}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#def5ff;background-image:radial-gradient(#8ac8e280 1.4px,transparent 1.4px);background-size:18px 18px}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ff9a33;outline-offset:4px}.shell{width:min(980px,calc(100% - 24px));margin:18px auto 42px}.top{background:linear-gradient(115deg,#0f58bd,#219bdd);color:#fff;border:4px solid var(--ink);border-radius:28px;padding:22px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.top:after{content:"✦ ✧ ★";position:absolute;right:16px;top:6px;font-size:65px;color:#ffffff24;transform:rotate(-12deg)}.eyebrow{display:inline-block;font-size:15px;font-weight:900;letter-spacing:2px;color:#1b2940;background:var(--yellow);padding:6px 15px;border-radius:50px;border:2px solid var(--ink)}h1{font-size:clamp(32px,6vw,57px);letter-spacing:2px;margin:11px 0 5px;text-shadow:3px 4px #123772}h2{font-size:clamp(22px,4vw,31px);margin:0 0 10px}.subtitle{font-size:clamp(15px,2.5vw,19px);margin:0;max-width:630px}.panel{border:4px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:var(--shadow);margin-top:22px;padding:24px}.section-name{font-size:16px;font-weight:900;letter-spacing:1px;color:#44607f;margin:0 0 14px}.booths{display:grid;grid-template-columns:1fr 1fr;gap:18px}.booth{min-height:218px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:21px;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 #1d2c45;transition:transform .15s,box-shadow .15s}.booth:disabled{opacity:.76;cursor:default;box-shadow:none}.booth:hover:not(:disabled){transform:translateY(-3px);box-shadow:5px 8px 0 #1d2c45}.booth .emoji{font-size:55px;line-height:1}.booth strong{font-size:clamp(23px,3.9vw,31px)}.booth small{font-size:15px;font-weight:750}.marble{background:#ffe9f3}.rocket{background:#e1f7ff}.pill{display:inline-block;border:2px solid #18233b;border-radius:99px;padding:5px 12px;font-weight:900;background:#fff;font-size:14px}.help{line-height:1.75;background:#eef6ff;border-left:6px solid #4b9eec;padding:12px 16px;border-radius:10px;margin-top:18px}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.back,.reset{padding:8px 15px;background:#fff;border:2px solid var(--ink);border-radius:12px;font-weight:850}.progress{font-weight:850;color:#356482}.question-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.qpick{border:3px solid var(--ink);border-radius:16px;min-height:132px;background:#edf8ff;box-shadow:3px 4px 0 #233352;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:13px;text-align:left;gap:8px}.qpick .number{background:var(--yellow);padding:3px 10px;border:2px solid var(--ink);border-radius:10px;font-weight:950}.qpick .qname{font-weight:900;font-size:16px}.qpick.done{background:#d6fae7}.qpick.done .number{background:#6be2a3}.question-card{max-width:800px;margin:auto}.question-title{font-size:clamp(22px,4vw,31px);font-weight:950;line-height:1.45;margin:18px 0}.answers{display:grid;gap:12px;margin:20px 0}.answer{width:100%;padding:16px 17px;border:3px solid #23324d;border-radius:16px;background:#fff;text-align:left;font-size:clamp(16px,2.5vw,20px);font-weight:800;transition:background .15s,transform .15s}.answer:hover:not(:disabled){background:#fff1bd;transform:translateX(3px)}.answer:disabled{cursor:default}.answer.wrong{border-color:#d5376b;background:#ffe1e9}.answer.correct{border-color:#087d58;background:#c9ffdf}.feedback{padding:17px;border-radius:18px;border:3px solid var(--ink);margin:14px 0;line-height:1.7}.feedback.bad{background:#fff0cc}.feedback.good{background:#d6f9e6}.feedback b{font-size:22px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.primary{border:3px solid var(--ink);border-radius:13px;box-shadow:3px 4px #23324d;background:var(--yellow);padding:12px 23px;font-weight:950}.secondary{border:3px solid var(--ink);border-radius:13px;background:white;padding:12px 20px;font-weight:850}.celebrate{text-align:center;padding:17px 3px}.huge{font-size:76px;line-height:1.25}.banner{background:#fff0a9;border:3px solid var(--ink);padding:16px;border-radius:15px;margin:15px auto;font-size:20px;font-weight:900;max-width:610px}.scorebar{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px}.scorebar span{background:white;border:2px solid var(--ink);padding:7px 11px;border-radius:100px;font-size:14px;font-weight:900}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.footer{text-align:center;color:#58748d;font-size:13px;margin-top:22px;font-weight:700}@media(max-width:650px){.booths{grid-template-columns:1fr}.booth{min-height:175px}.question-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:17px}.top{padding:20px}.qpick{min-height:116px}}@media(max-width:350px){.question-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><header class="top"><div class="eyebrow">KIST × 中華資優｜科學節</div><h1>🏁 科學闖關挑戰</h1><p class="subtitle">先動手實驗，再挑戰科學問答！兩攤各任選一題答對，出示完成畫面後交給下一位！</p><div id="score" class="scorebar" aria-live="polite"></div></header><section class="panel" id="app" aria-live="polite"></section><div class="footer">中華科研基地・互動科學問答｜不收集學生資料｜工作人員確認後可立即清空</div></main><script>
'use strict';
const BANK={
 marble:{name:'彈珠王極限挑戰',icon:'🔵',color:'marble',caption:'彈力發射・挑戰360°迴圈軌道',questions:[
 {t:'彈珠衝出去的能量從哪裡來？',a:['橡皮筋儲存的彈性位能','彈珠自己產生的電力','空氣把彈珠吸出去'],c:0,why:'拉動橡皮筋時會儲存彈性位能，放開後，部分能量轉換成彈珠的動能。',short:'彈力與能量'},
 {t:'彈珠沿著圓圈向上爬時，速度通常會怎樣？',a:['愈爬愈快','愈爬愈慢','一定完全不變'],c:1,why:'向上爬升需要增加重力位能，因此部分動能轉換成重力位能，速度通常會減慢。',short:'上坡的速度'},
 {t:'彈珠經過圓形軌道最高點時，最需要具備什麼條件？',a:['足夠的速度','漂亮的顏色','更響亮的聲音'],c:0,why:'彈珠必須保有足夠的速度，才有可能在最高點維持繞圈運動，不會提前脫離軌道。',short:'繞圈的關鍵'},
 {t:'當彈珠沿著圓圈往下滾時，哪一種能量通常會增加？',a:['彈性位能','動能','電能'],c:1,why:'彈珠往下移動時，重力位能可轉換為動能，所以通常會加速。',short:'下坡能量變化'},
 {t:'把橡皮筋拉得更長，就一定能成功繞圈嗎？',a:['一定，拉最長就好','不一定，還受到摩擦、發射方向與軌道影響','一定會讓彈珠變輕'],c:1,why:'拉得更長通常能儲存更多彈性位能，但也有彈性極限，還要考慮發射與軌道的能量損失。',short:'拉越長越好？'},
 {t:'哪一個做法最有機會改善彈珠的過關表現？',a:['把軌道弄得凹凸不平','讓發射方向對準軌道，並調整適合的彈力','一直換不同顏色的彈珠'],c:1,why:'穩定的發射方向與適當的發射力，能幫助彈珠有效地取得速度並減少不必要的碰撞。',short:'最佳化挑戰'},
 {t:'在其他條件相同下，圓形軌道變大，成功繞圈通常會？',a:['更容易，因為軌道更長','更困難，因為需要爬升更高','完全沒有差別'],c:1,why:'較大的圓圈通常代表彈珠要爬得更高，需要更多能量，也需要足夠的速度維持圓周運動。',short:'軌道變大'},
 {t:'彈珠沿圓圈移動時，哪一個描述比較正確？',a:['運動方向一直不變','需要指向圓心的合力來改變運動方向','彈珠不再受到重力'],c:1,why:'做圓周運動時，彈珠的運動方向持續改變，需要指向圓心的合力；重力仍然存在。',short:'圓周運動'}
 ]},
 rocket:{name:'空氣動力車・保齡球挑戰',icon:'🚗',color:'rocket',caption:'純空氣推進・撞倒寶特瓶',questions:[
 {t:'空氣動力車不加水，為什麼還能向前跑？',a:['因為車子有魔法','壓縮空氣向後噴出，讓車子受到向前的推力','因為寶特瓶會吸引車子'],c:1,why:'瓶內的壓縮空氣向後噴出時，車子會受到向前的推力。這是作用力與反作用力的表現。',short:'沒有水也能跑？'},
 {t:'我們利用打氣筒為車子打氣，最主要是為了什麼？',a:['增加瓶內的空氣壓力','讓輪胎變成磁鐵','讓車子變輕到飄起來'],c:0,why:'打氣把更多空氣壓入瓶內，形成較高壓力。釋放後，空氣噴出，推動車子前進。',short:'打氣的祕密'},
 {t:'空氣從車尾向後噴出時，車子會朝哪個方向前進？',a:['向前','向後','一定向上飛'],c:0,why:'空氣向後噴出，對車子產生向前的反作用力，讓車子往前跑。',short:'車子往哪走？'},
 {t:'車子撞到前方的寶特瓶時，為什麼寶特瓶會倒下？',a:['車子在碰撞時對寶特瓶施力','因為寶特瓶自己想倒','因為空氣把寶特瓶吸走'],c:0,why:'車子撞擊寶特瓶時會施力，改變寶特瓶的運動狀態；若碰撞造成足夠的轉動效果，寶特瓶就會傾倒。',short:'撞倒的原因'},
 {t:'假如車子沒有對準寶特瓶，最可能發生什麼事？',a:['一定全部擊倒','可能撞不到，或只能擊倒少數寶特瓶','車子會自動轉彎去找目標'],c:1,why:'發射方向會影響碰撞位置。像打保齡球一樣，對準目標能提高擊倒機會。',short:'瞄準很重要'},
 {t:'車輪如果卡住，會對挑戰造成什麼影響？',a:['車子可能跑得不順、距離變短','車子會變成真正的火箭飛起來','完全沒有影響'],c:0,why:'輪子卡住會增加阻力，讓車子較難順利前進，碰撞寶特瓶時的速度也可能降低。',short:'輪子的阻力'},
 {t:'想要擊倒更多寶特瓶，哪一種調整比較合理？',a:['每次都亂改方向','調整車子前進方向，觀察撞擊位置並重試','直接用手推倒寶特瓶'],c:1,why:'觀察車子的路線、碰撞點及擊倒數量，再調整發射方向，就像科學家反覆做實驗。',short:'擊倒更多瓶'},
 {t:'哪一種操作最安全？',a:['站在行進路線正前方看車子撞來','未經同意就一直打氣','由工作人員確認壓力和路線，確認前方無人後再發射'],c:2,why:'壓縮空氣裝置應由工作人員確認安全，使用合適壓力，並確保車子行進方向沒有其他人。',short:'安全發射'}
 ]}
};
let progress={marble:[],rocket:[]};
let booth=null,index=null,failed=[];const app=document.getElementById('app');const score=document.getElementById('score');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateScore(){score.innerHTML=Object.entries(BANK).map(([k,b])=>`<span>${b.icon} ${b.name}：${progress[k].length?'✅ 已過關':'⬜ 尚未過關'}</span>`).join('')}
function complete(){return Object.keys(BANK).every(k=>progress[k].length>0)}
function resetAll(){progress={marble:[],rocket:[]};booth=null;index=null;failed=[];home()}
function completedScreen(){booth=null;index=null;updateScore();app.innerHTML=`<div class="celebrate"><div class="huge">🏆🎉🏆</div><h2>雙攤位闖關完成！</h2><div class="banner">🔵 彈珠王 ✅　🚗 空氣動力車 ✅</div><p style="font-size:20px;font-weight:900">兩個攤位各答對一題，恭喜過關！</p><p>請出示畫面讓工作人員確認。</p><div class="actions" style="justify-content:center"><button class="primary" data-action="next">✅ 工作人員確認｜下一位學生</button></div><p style="font-size:14px;color:#54718b">確認後按下按鈕，會清空本次作答並返回起始畫面。</p></div>`}
function nav(){return `<div class="nav"><button class="back" data-action="home">← 選擇攤位</button><span class="progress">${BANK[booth].icon} ${BANK[booth].name}</span></div>`}
function home(){if(complete()){completedScreen();return}booth=null;index=null;updateScore();app.innerHTML=`<p class="section-name">STEP 1 · 選擇科學攤位</p><h2>今天要挑戰哪一關？</h2><div class="booths">${Object.entries(BANK).map(([k,b])=>`<button class="booth ${b.color}" data-action="booth" data-key="${k}" ${progress[k].length?'disabled':''}><span class="emoji" aria-hidden="true">${b.icon}</span><strong>${b.name}</strong><small>${b.caption}</small><span class="pill">${progress[k].length?'✅ 這一關已過關':'開始科學問答 →'}</span></button>`).join('')}</div><div class="help"><strong>🎯 闖關規則：</strong>每個攤位自由選一題，答對就算通過該攤位問答。兩攤各答對一題後，會顯示完成畫面。<br>👩‍🏫 工作人員確認後，按「下一位學生」即可清空紀錄，交給下一位。重新整理也會清空本次答題。</div>`}
function selection(k){if(complete()){completedScreen();return}if(progress[k].length){home();return}booth=k;index=null;updateScore();const b=BANK[k];app.innerHTML=`${nav()}<p class="section-name">STEP 2 · 自由選擇一題</p><h2>${b.icon} ${b.name}</h2><p>不需要照順序！<strong>答對任意一題，就完成這個攤位的科學問答。</strong></p><div class="question-grid">${b.questions.map((q,i)=>`<button class="qpick" data-action="question" data-index="${i}"><span class="number">第 ${i+1} 題</span><span class="qname">${escape(q.short)}</span></button>`).join('')}</div><div class="actions"><button class="secondary" data-action="home">返回選擇攤位</button></div>`}
function question(i){index=i;failed=[];const q=BANK[booth].questions[i];app.innerHTML=`${nav()}<div class="question-card"><p class="section-name">STEP 3 · 選出正確答案｜第 ${i+1} 題</p><h2 class="question-title">${escape(q.t)}</h2><div class="answers">${q.a.map((a,j)=>`<button class="answer" data-action="answer" data-option="${j}"><strong>${'ABC'[j]}.</strong> ${escape(a)}</button>`).join('')}</div><div id="feedback" aria-live="assertive"></div><div class="actions"><button class="secondary" data-action="booth" data-key="${booth}">← 換一題</button></div></div>`}
function answer(opt){if(!booth||progress[booth].length)return;const q=BANK[booth].questions[index];let buttons=[...app.querySelectorAll('.answer')];if(opt===q.c){progress[booth]=[index];updateScore();buttons.forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct')});const both=complete();app.querySelector('#feedback').innerHTML=`<div class="feedback good"><b>🎉 答對了！</b><div>${escape(q.why)}</div></div><div class="celebrate"><div class="huge">${both?'🏆🎉':'✅✨'}</div><h2>${both?'恭喜！雙攤位都過關！':'這一攤過關成功！'}</h2><div class="banner">${BANK[booth].icon} ${BANK[booth].name}｜✅ 完成</div><p>請出示這個畫面給攤位工作人員。</p><div class="actions" style="justify-content:center">${both?'<button class="primary" data-action="complete">查看雙攤位完成畫面</button>':'<button class="primary" data-action="home">前往另一個攤位 →</button>'}</div></div>`;app.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}else{buttons[opt].classList.add('wrong');buttons[opt].disabled=true;app.querySelector('#feedback').innerHTML=`<div class="feedback bad"><b>💪 再試一次！</b><div>這個答案還不對，觀察實驗現象，再選一個答案吧！</div></div>`}}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='home')home();else if(a==='booth')selection(b.dataset.key);else if(a==='question')question(Number(b.dataset.index));else if(a==='answer')answer(Number(b.dataset.option));else if(a==='complete')completedScreen();else if(a==='next')resetAll();});home();
</script></body></html>
